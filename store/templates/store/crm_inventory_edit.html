{% extends "store/crm_base.html" %}

{% block title %}
Edit Product | Bows & Meows CRM
{% endblock %}

{% block content %}

<section class="crm-page">

    <div class="crm-heading">
        <div>
            <span>INVENTORY</span>
            <h1>Edit Product</h1>
            <p>{{ product.name }}</p>
        </div>

        <a href="{% url 'crm_inventory' %}" class="crm-admin-btn">
            ← Inventory
        </a>
    </div>


    <div class="crm-panel crm-form-panel">

        <form method="POST" enctype="multipart/form-data">
            <label>Product Image</label>

            {% if product.image %}

                <div class="crm-current-image">

                    <img
                        src="{{ product.image.url }}"
                        alt="{{ product.name }}"
                    >

                </div>

            {% endif %}

            <input
            type="file"
            name="image"
            accept="image/*"
            >

            {% csrf_token %}

            <label>Product Name</label>

            <input
                type="text"
                name="name"
                value="{{ product.name }}"
                required
            >


            <label>Price</label>

            <input
                type="number"
                step="0.01"
                name="price"
                value="{{ product.price }}"
                required
            >


            <label>Stock</label>

            <input
                type="number"
                name="stock"
                value="{{ product.stock }}"
                required
            >


            <label class="checkbox-label">

                <input
                    type="checkbox"
                    name="is_available"
                    {% if product.is_available %}
                        checked
                    {% endif %}
                >

                Available for sale

            </label>


            <button type="submit" class="crm-save-btn">
                Save Changes
            </button>

        </form>

    </div>

</section>

{% endblock %}
