{% extends "store/base.html" %}

{% block title %}
Payment Cancelled | Bows & Meows
{% endblock %}

{% block content %}

<section class="account-page">

    <div class="success-card">

        <h1>Payment Cancelled</h1>

        <p>
            Your payment was not completed.
        </p>

        <p>
            Order #{{ order.id }}
        </p>

        <h2>
            ₹{{ order.total_amount|floatformat:2 }}
        </h2>

        <a
            href="{% url 'retry_payment' order.id %}"
            class="product-detail-cart"
        >
            Retry Payment
        </a>

        <a
            href="{% url 'my_orders' %}"
            class="wishlist-btn"
        >
            My Orders
        </a>

    </div>

</section>

{% endblock %}
