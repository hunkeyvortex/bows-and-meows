{% extends "store/base.html" %}

{% block title %}
Edit Address | Bows & Meows
{% endblock %}

{% block content %}

<section class="account-page">

    <div class="section-heading">
        <span>DELIVERY</span>
        <h1>Edit Address</h1>
    </div>

    <form method="POST" class="address-form">

        {% csrf_token %}

        <label>Full Name</label>
        <input
            type="text"
            name="full_name"
            value="{{ address.full_name }}"
            required
        >

        <label>Phone Number</label>
        <input
            type="text"
            name="phone"
            value="{{ address.phone }}"
            required
        >

        <label>Address</label>
        <input
            type="text"
            name="address_line1"
            value="{{ address.address_line1 }}"
            required
        >

        <label>Area / Landmark</label>
        <input
            type="text"
            name="address_line2"
            value="{{ address.address_line2 }}"
        >

        <label>City</label>
        <input
            type="text"
            name="city"
            value="{{ address.city }}"
            required
        >

        <label>State</label>
        <input
            type="text"
            name="state"
            value="{{ address.state }}"
            required
        >

        <label>PIN Code</label>
        <input
            type="text"
            name="pincode"
            value="{{ address.pincode }}"
            required
        >

        <label>
            <input
                type="checkbox"
                name="is_default"
                {% if address.is_default %}checked{% endif %}
            >
            Make this my default address
        </label>

        <button
            type="submit"
            class="product-detail-cart"
        >
            Save Changes
        </button>

    </form>

</section>

{% endblock %}
