{% extends "store/base.html" %}

{% block title %}
Payment | Bow & Meow
{% endblock %}

{% block content %}

<section class="account-page">

    <div class="success-card">

        <h1>Complete Your Payment</h1>

        <p>
            Order #{{ order.id }}
        </p>

        <h2>
            ₹{{ order.total_amount|floatformat:2 }}
        </h2>

        <button
            id="pay-button"
            class="product-detail-cart"
        >
            Pay Now
        </button>

    </div>

</section>

<form method="POST" action="{% url 'payment_cancelled' order.id %}" id="payment-cancelled-form">
    {% csrf_token %}
</form>
<form method="POST" action="{% url 'payment_failed_view' order.id %}" id="payment-failed-form">
    {% csrf_token %}
</form>


<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
    var options = {

        "key": "{{ razorpay_key_id }}",
        "amount": "{{ amount }}",
        "currency": "INR",
        "name": "Bow & Meow",
        "description": "Pet Store Order #{{ order.id }}",
        "order_id": "{{ razorpay_order_id }}",

        "handler": function (response) {

            window.location.href =
                "{% url 'verify_payment' %}" +
                "?razorpay_payment_id=" +
                response.razorpay_payment_id +
                "&razorpay_order_id=" +
                response.razorpay_order_id +
                "&razorpay_signature=" +
                response.razorpay_signature;
        },

        "modal": {
            "ondismiss": function () {

                document.getElementById("payment-cancelled-form").submit();
            }
        }
    };


    var razorpay = new Razorpay(options);


    razorpay.on(
        "payment.failed",
        function (response) {

            document.getElementById("payment-failed-form").submit();
        }
    );


    document
        .getElementById("pay-button")
        .onclick = function(e) {

            razorpay.open();
            e.preventDefault();
        };
</script>

{% include "store/includes/flow_theme.html" %}{% endblock %}
