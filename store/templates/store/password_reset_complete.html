{% extends "store/base.html" %}

{% block content %}

<section class="account-page">

    <div class="auth-card">

        <h1 class="password-reset-status" tabindex="-1" role="status">Password changed successfully</h1>

        <p>
            Your new password is saved. You can now sign in with it. Your old password will no longer work.
        </p>

        <a
            href="{% url 'login' %}"
            class="product-detail-cart"
        >
            Sign in with your new password
        </a>

    </div>

</section>

{% include "store/includes/flow_theme.html" %}
<script>document.querySelector('.password-reset-status').focus();</script>
{% endblock %}
